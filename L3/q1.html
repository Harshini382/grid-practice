
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            display: grid;
            min-height: 100vh;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 80px 1fr 70px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            gap: 10px;
            padding: 10px;
        }

        header {
            grid-area: header;
            background-color: #2563eb;
            color: white;
        }

        aside {
            grid-area: sidebar;
            background-color: #334155;
            color: white;
        }

        main {
            grid-area: main;
            background-color: #e2e8f0;
        }

        footer {
            grid-area: footer;
            background-color: #1e293b;
            color: white;
        }

        header, aside, main, footer {
            padding: 25px;
            border-radius: 8px;
        }

        /* Mobile responsive layout */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 70px auto 1fr 60px;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h2>My Website</h2>
        </header>

        <aside>
            <h3>Sidebar</h3>
            <p>Home</p>
            <p>About</p>
            <p>Services</p>
            <p>Contact</p>
        </aside>

        <main>
            <h2>Main Content</h2>
            <p>
                Welcome to my advanced CSS Grid layout.
                This is the main content section.
            </p>
        </main>

        <footer>
            <p>© 2026 My Website. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
