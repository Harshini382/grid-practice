
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Photo Wall</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;

            display: grid;

            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;

            gap: 12px;

            /* Fill empty spaces automatically */
            grid-auto-flow: dense;
        }

        .photo {
            overflow: hidden;
            border-radius: 10px;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .photo:hover img {
            transform: scale(1.08);
        }

        /* Different photo sizes */

        .photo:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }

        .photo:nth-child(2) {
            grid-row: span 2;
        }

        .photo:nth-child(5) {
            grid-column: span 2;
        }

        .photo:nth-child(7) {
            grid-row: span 2;
        }

        .photo:nth-child(9) {
            grid-column: span 2;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 160px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 130px;
                gap: 8px;
            }

            .photo:nth-child(1) {
                grid-column: span 2;
                grid-row: span 2;
            }

            .photo:nth-child(2) {
                grid-row: span 1;
            }

            .photo:nth-child(5) {
                grid-column: span 2;
            }

            .photo:nth-child(7) {
                grid-row: span 1;
            }
        }

    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <p class="description">
        A collection of beautiful moments around the world.
    </p>

    <div class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                 alt="Beautiful mountain lake">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Mountain landscape">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
                 alt="Sunrise landscape">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 alt="Green forest">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800"
                 alt="Mountain and lake">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600"
                 alt="Ocean waves">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                 alt="Snowy mountains">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600"
                 alt="Beautiful beach">
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800"
                 alt="Wildlife in nature">
        </div>

    </div>

</body>
</html>
