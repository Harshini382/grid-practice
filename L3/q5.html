
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        /* Navbar */

        .navbar {
            background: #1e293b;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;

            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Main content */

        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .content p {
            color: #64748b;
            font-size: 18px;
        }

        /* Mobile navbar */

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .nav-links {
                flex-direction: column;
                gap: 15px;
            }

            .content h1 {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <ul class="nav-links">

            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Services</a></li>

            <li><a href="#">Portfolio</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

    </nav>

    <main class="content">

        <h1>Welcome to My Website</h1>

        <p>
            This is a responsive navigation bar
            built using CSS Flexbox.
        </p>

    </main>

</body>
</html>
